<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск себя на фото</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --accent-color: #0066cc;
            --muted-color: #666666;
            --success-color: #28a745;
            --warning-color: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            gap: 40px;
        }

        .panel {
            text-align: center;
            background: #fafafa;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 320px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--muted-color);
        }

        .upload-area {
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 2px dashed var(--muted-color);
            border-radius: 10px;
            background: #f5f5f5;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: var(--accent-color);
        }

        .ref-preview, .target-preview {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .preview-img {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .clear-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--warning-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.8;
        }

        .clear-btn:hover {
            opacity: 1;
        }

        .status {
            min-height: 24px;
            font-size: 14px;
            color: var(--muted-color);
            margin-bottom: 15px;
        }

        .result-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        #group-photo {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 12px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .label-box {
            position: absolute;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.3;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            transform: translate(-50%, 100%);
            left: 50%;
            margin-top: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .recognized {
            border: 3px solid var(--success-color) !important;
            background: rgba(40, 167, 69, 0.7) !important;
            color: #fff;
        }

        .not-recognized {
            border: 2px solid var(--warning-color);
            background: rgba(220, 53, 69, 0.7);
            color: #fff;
        }

        .disclaimer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: var(--muted-color);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Левая панель: Загрузка своего фото -->
    <div class="panel">
        <h1>Ваша фотография</h1>
        <p class="subtitle">Загрузите фото, чтобы алгоритм вас запомнил</p>
        
        <div class="upload-area">
            <input type="file" id="refFileInput" accept="image/*" aria-label="Загрузить свое фото">
        </div>

        <div class="ref-preview" id="refPreview" style="display: none;">
            <button class="clear-btn" id="clearRefBtn" aria-label="Удалить свое фото">&times;</button>
            <img id="refImg" src="" alt="Ваше фото" class="preview-img">
        </div>

        <div id="refStatus" class="status">Ожидание загрузки...</div>
    </div>

    <!-- Правая панель: Общая фотография -->
    <div class="panel">
        <h1>Общая фотография</h1>
        <p class="subtitle">Загрузите групповое фото для поиска</p>

        <div class="upload-area">
            <input type="file" id="targetFileInput" accept="image/*" aria-label="Загрузить групповое фото">
        </div>

        <div id="targetStatus" class="status" style="display: none;">Ожидание загрузки...</div>

        <div class="result-container" id="targetResultContainer" style="display: none;">
            <img id="group-photo" src="" alt="Групповое фото">
            <canvas id="overlay"></canvas>
        </div>
    </div>

    <div class="disclaimer">
        Ваши фото обрабатываются только в вашем браузере и никуда не отправляются. Изображение не сохраняется на сервере.
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <!-- Face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';

        // Элементы DOM
        const refFileInput = document.getElementById('refFileInput');
        const refImg = document.getElementById('refImg');
        const refPreview = document.getElementById('refPreview');
        const refStatus = document.getElementById('refStatus');
        const clearRefBtn = document.getElementById('clearRefBtn');

        const targetFileInput = document.getElementById('targetFileInput');
        const groupPhoto = document.getElementById('group-photo');
        const targetStatus = document.getElementById('targetStatus');
        const targetResultContainer = document.getElementById('targetResultContainer');
        const overlayCanvas = document.getElementById('overlay');

        // Состояние приложения
        let userDescriptor = null;
        let modelsLoaded = false;
        let modelsLoading = false;

        // Загрузка моделей
        async function loadModels() {
            if (modelsLoaded) return;
            if (modelsLoading) {
                while (!modelsLoaded) await new Promise(r => setTimeout(r, 100));
                return;
            }
            modelsLoading = true;
            refStatus.textContent = 'Загрузка моделей...';
            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                modelsLoaded = true;
                refStatus.textContent = 'Модели загружены. Загрузите свое фото.';
            } catch (err) {
                refStatus.textContent = 'Ошибка загрузки моделей.';
                console.error(err);
            } finally {
                modelsLoading = false;
            }
        }

        // Обработка своего фото (создание дескриптора)
        async function processReferenceImage(img) {
            refStatus.textContent = 'Анализирую ваше лицо...';
            const detection = await faceapi.detectSingleFace(img, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (detection) {
                userDescriptor = detection.descriptor;
                refStatus.innerHTML = '<span style="color: var(--success-color);">✅ Лицо сохранено. Теперь загрузите групповое фото.</span>';
            } else {
                refStatus.textContent = 'Лицо не найдено на фото. Попробуйте другое.';
                userDescriptor = null;
            }
        }

        // Обработка группового фото (поиск совпадений)
        async function processTargetImage(img) {
            if (!userDescriptor) {
                targetStatus.textContent = 'Сначала загрузите свое фото (слева).';
                return;
            }

            targetStatus.textContent = 'Распознаю лица на групповом фото...';
            targetResultContainer.style.display = 'block';

            const displaySize = { width: img.width, height: img.height };
            overlayCanvas.width = img.width;
            overlayCanvas.height = img.height;
            const ctx = overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const detections = await faceapi.detectAllFaces(img, new faceapi.SsdMobilenetv1Options())
                .withFaceLandmarks()
                .withFaceDescriptors();

            if (detections.length === 0) {
                targetStatus.textContent = 'Лица на фото не найдены.';
                return;
            }

            const resizedDetections = faceapi.resizeResults(detections, displaySize);

            // Порог схожести (чем меньше, тем строже). 0.5 - среднее значение.
            const DISTANCE_THRESHOLD = 0.5;

            resizedDetections.forEach(detection => {
                const box = detection.detection.box;
                const desc = detection.descriptor;
                
                // Вычисляем расстояние между вектором пользователя и вектором найденного лица
                const distance = faceapi.euclideanDistance(userDescriptor, desc);
                const isUser = distance < DISTANCE_THRESHOLD;

                // Рисуем рамку
                const color = isUser ? 'limegreen' : 'orangered';
                const lineWidth = isUser ? 4 : 2;
                drawBox(ctx, box, color, lineWidth);

                // Подпись
                const label = isUser ? 'Это вы!' : `Чужое лицо (dist: ${distance.toFixed(2)})`;
                const labelY = box.y + box.height + 20;
                
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = color;
                const textWidth = ctx.measureText(label).width;
                ctx.fillText(label, box.x + box.width / 2 - textWidth / 2, labelY);
            });

            targetStatus.textContent = `Найдено ${detections.length} лиц. Рамка зеленого цвета — это вы.`;
        }

        // Вспомогательная функция рисования рамки
        function drawBox(ctx, box, color, lineWidth) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.strokeRect(box.x, box.y, box.width, box.height);
        }

        // Обработчики событий
        refFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                refImg.src = img.src;
                refPreview.style.display = 'block';
                processReferenceImage(img);
            };
            img.onerror = () => refStatus.textContent = 'Ошибка загрузки.';
            const reader = new FileReader();
            reader.onload = ev => img.src = ev.target.result;
            reader.readAsDataURL(file);
            refFileInput.value = '';
        });

        targetFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = () => {
                groupPhoto.src = img.src;
                processTargetImage(img);
            };
            img.onerror = () => targetStatus.textContent = 'Ошибка загрузки.';
            const reader = new FileReader();
            reader.onload = ev => img.src = ev.target.result;
            reader.readAsDataURL(file);
            targetFileInput.value = '';
        });

        clearRefBtn.addEventListener('click', () => {
            refImg.src = '';
            refPreview.style.display = 'none';
            userDescriptor = null;
            refStatus.textContent = 'Ваше фото удалено. Загрузите новое.';
            // Скрываем результаты поиска, так как эталон изменился
            targetResultContainer.style.display = 'none';
            groupPhoto.src = '';
        });

        // Предзагрузка моделей
        document.addEventListener('DOMContentLoaded', () => {
            loadModels();
        });
    </script>

</body>
</html>
